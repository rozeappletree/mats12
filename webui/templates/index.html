<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Steered Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="app">
    <header>
      <h1>Steered Chat</h1>
      <div class="header-actions">
        <label class="toggle">
          <input type="checkbox" id="scores-toggle" checked>
          auto scores
        </label>
        <button id="system-btn" class="btn-secondary">System prompt</button>
        <button id="reset-btn" class="btn-secondary">Reset chat</button>
        <button id="save-btn" class="btn-secondary">Save</button>
      </div>
    </header>

    <main>
      <section id="chat-pane">
        <div id="messages"></div>
        <form id="chat-form">
          <textarea id="chat-input" placeholder="Say something..." rows="2"></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </section>

      <aside id="attributes-panel" class="panel">
        <h2>Attributes</h2>
        <div id="attributes"></div>
      </aside>

      <aside id="scores-panel" class="panel">
        <h2>User scores</h2>
        <div id="scores">
          <p class="hint">send a message to see scores</p>
        </div>
      </aside>
    </main>
  </div>

  <div id="system-modal" class="modal hidden">
    <div class="modal-content">
      <h2>System prompt</h2>
      <textarea id="system-input" rows="8"></textarea>
      <div class="modal-actions">
        <button id="system-reset" class="btn-secondary">Reset to default</button>
        <button id="system-cancel" class="btn-secondary">Cancel</button>
        <button id="system-save" class="btn-primary">Save &amp; clear history</button>
      </div>
    </div>
  </div>

  <div id="save-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Save conversation</h2>
      <input id="save-input" type="text" placeholder="filename (e.g. my_run)">
      <div class="modal-actions">
        <button id="save-cancel" class="btn-secondary">Cancel</button>
        <button id="save-confirm" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
